name: Canary build

on:
  push:
    branches:
      - canary
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/canary.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

permissions:
  contents: read
  actions: read
  models: read

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      XRAY_VERSION: v26.10.3
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache-canary
          restore-keys: ${{ runner.os }}-ccache-canary
          append-timestamp: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Set up Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}-
            gradle-
      - name: Cache Xray-core downloads
        uses: actions/cache@v5
        with:
          path: TMessagesProj/build/xray
          key: xray-${{ env.XRAY_VERSION }}-${{ hashFiles('TMessagesProj/build.gradle') }}-${{ github.run_id }}
          restore-keys: |
            xray-${{ env.XRAY_VERSION }}-${{ hashFiles('TMessagesProj/build.gradle') }}-
            xray-${{ env.XRAY_VERSION }}-
            xray-
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          # ndk must match ndkVersion in the root build.gradle
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Set up Python (Chaquopy bridge source build)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install Cython (Chaquopy bridge source build)
        run: pip install Cython==3.0.11
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Canary Build
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          BUILD_TIMESTAMP: ${{ github.run_number }}
          XRAY_VERSION: ${{ env.XRAY_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew TMessagesProj:assembleNormalStaging --stacktrace
      - name: List APK outputs
        run: find TMessagesProj/build/outputs/apk/normal/staging -name '*.apk' -exec ls -la {} \;
      - uses: actions/upload-artifact@v6
        with:
          name: normal-canary
          path: TMessagesProj/build/outputs/apk/normal/staging/
          if-no-files-found: error
