# Manual vXGram build: normal + plugin staging APKs (per-ABI; normal also includes universal).
# Successful builds publish APKs to GitHub Releases unless skip_release is set.
name: vXGram build

on:
  workflow_dispatch:
    inputs:
      skip_release:
        description: "Skip GitHub Release (APKs still upload as Actions artifacts)"
        type: boolean
        default: false
      release_tag:
        description: "Override release tag (default: v{APP_VERSION_NAME}-vX.{VX_VERSION_NAME})"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

env:
  XRAY_VERSION: v26.10.3
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_HARDLINK: "true"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "10G"

jobs:
  build:
    name: Gradle Build (normal + plugin staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Read version
        run: |
          APP_VERSION_NAME=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          VX_VERSION_NAME=$(grep -E '^VX_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "VX_VERSION_NAME=$VX_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Default release tag: v${APP_VERSION_NAME}-vX.${VX_VERSION_NAME}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.16
        with:
          append-timestamp: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Set up Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}

      - name: Cache Xray-core downloads
        uses: actions/cache@v5
        with:
          path: TMessagesProj/build/xray
          key: xray-${{ env.XRAY_VERSION }}-${{ hashFiles('TMessagesProj/build.gradle') }}
          restore-keys: |
            xray-${{ env.XRAY_VERSION }}-
            xray-

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"

      - name: Set up Python (Chaquopy bridge source build)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Install Cython (Chaquopy bridge source build)
        run: pip install Cython==3.0.11

      - name: Configure Android SDK Path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Tune Gradle for CI (memory and stability)
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Runner RAM: ${MEMORY_GB}GB"
          if [ "$MEMORY_GB" -ge 12 ]; then
            HEAP=8G
            META=2G
          elif [ "$MEMORY_GB" -ge 7 ]; then
            HEAP=6G
            META=1536m
          else
            HEAP=4G
            META=1024m
          fi
          sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
          sed -i '/^org\.gradle\.configuration-cache=/d' gradle.properties
          sed -i '/^org\.gradle\.parallel=/d' gradle.properties
          {
            echo "org.gradle.jvmargs=-Xmx${HEAP} -XX:MaxMetaspaceSize=${META} -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.configuration-cache=false"
            echo "org.gradle.parallel=true"
          } >> gradle.properties

      - name: Create CI signing keystore
        run: |
          rm -f TMessagesProj/release.keystore
          keytool -genkeypair -noprompt \
            -keystore TMessagesProj/release.keystore \
            -alias androidkey \
            -storepass android \
            -keypass android \
            -dname "CN=vXGram CI" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build vXGram APKs
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          BUILD_TIMESTAMP: ${{ github.run_number }}
          COMMIT_ID: ${{ github.sha }}
          XRAY_VERSION: ${{ env.XRAY_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew TMessagesProj:assembleStaging --stacktrace

      - name: List APK outputs
        run: |
          find TMessagesProj/build/outputs/apk/normal/staging -name '*.apk' -exec ls -la {} \;
          find TMessagesProj/build/outputs/apk/plugin/staging -name '*.apk' -exec ls -la {} \;

      - name: Upload normal APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: vXGram-normal-apks-${{ github.sha }}
          path: TMessagesProj/build/outputs/apk/normal/staging/*.apk
          if-no-files-found: error

      - name: Upload plugin APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: vXGram-plugin-apks-${{ github.sha }}
          path: TMessagesProj/build/outputs/apk/plugin/staging/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_release != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('v{0}-vX.{1}', env.APP_VERSION_NAME, env.VX_VERSION_NAME) }}
          name: vXGram ${{ env.APP_VERSION_NAME }}-vX.${{ env.VX_VERSION_NAME }}
          files: |
            TMessagesProj/build/outputs/apk/normal/staging/*.apk
            TMessagesProj/build/outputs/apk/plugin/staging/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
